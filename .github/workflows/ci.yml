# Sprint 7 T1 — CI gate (docs/TESTING.md): nothing merges unless every job is green.
name: CI

on:
  push:
    branches: [develop, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hygiene check tests
        run: bash scripts/check-hygiene.test.sh
      - name: No private files tracked
        run: bash scripts/check-hygiene.sh

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build
      - name: Dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (tests with Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: bash mvnw -B -ntp verify
