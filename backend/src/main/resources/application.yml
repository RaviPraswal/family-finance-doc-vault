spring:
  application:
    name: finnest
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  config:
    import: optional:classpath:application-secrets.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/finnest_db}
    username: ${SPRING_DATASOURCE_USERNAME:finnest}
    password: ${SPRING_DATASOURCE_PASSWORD:finnest_password}
    driver-class-name: org.postgresql.Driver
  # Schema changes go through Flyway migrations in db/migration (Sprint 3, S3-09).
  # Existing databases are adopted at version 1 without running V1; new ones are built by V1.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Gemini AI Configuration (via OpenAI compatibility)
  ai:
    # Sprint 7 T9 (D-10): at most one retry, none for quota errors (429) — retrying a daily quota only adds delay.
    retry:
      max-attempts: 2
      on-client-errors: false
      exclude-on-http-codes: 429
      backoff:
        initial-interval: 2s
        multiplier: 2
        max-interval: 5s
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        options:
          model: gemini-3-flash-preview

  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 900000 # 15 minutes
  refresh-expiration: 2592000000 # 30 days

app:
  storage:
    # Point this at a persistent disk in production (e.g. a Render disk mount). Local default: ./uploads
    path: ${FILE_STORAGE_PATH:uploads}
